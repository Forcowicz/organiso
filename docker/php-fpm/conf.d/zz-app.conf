; =============================================================================
; docker/php-fpm/conf.d/zz-app.conf
;
; Prefixed "zz-" so this file is loaded last and overrides any defaults set by
; the base php-fpm image (which ships its own www.conf).
; =============================================================================

[www]

; -------------------------------------------------------------------------
; Listen address
; -------------------------------------------------------------------------
; Nginx reaches php-fpm over the Docker network using the service name
; 'php-fpm' (defined in compose.prod.yaml), so we bind on all interfaces.
; -------------------------------------------------------------------------
listen = 0.0.0.0:9000

; -------------------------------------------------------------------------
; Process management
; -------------------------------------------------------------------------
; 'dynamic' scales workers between min/max based on demand.
; Tune pm.max_children to (available_RAM_MB / ~30 MB per worker).
; -------------------------------------------------------------------------
pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests      = 500

; -------------------------------------------------------------------------
; Status endpoint — REQUIRED by php-fpm-healthcheck
; -------------------------------------------------------------------------
; The healthcheck script in the Dockerfile polls this path to verify php-fpm
; is alive. Without it the Docker healthcheck will always fail.
; -------------------------------------------------------------------------
pm.status_path = /status

; -------------------------------------------------------------------------
; Timeouts & limits — kept in sync with nginx.conf (fastcgi_read_timeout)
; -------------------------------------------------------------------------
request_terminate_timeout = 300

; -------------------------------------------------------------------------
; File upload limits — kept in sync with nginx.conf (client_max_body_size)
; -------------------------------------------------------------------------
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size]       = 64M

; -------------------------------------------------------------------------
; Error logging
; -------------------------------------------------------------------------
php_admin_flag[log_errors]    = on
php_admin_value[error_log]    = /proc/self/fd/2
catch_workers_output          = yes
decorate_workers_output       = no
