user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
worker_connections  1024;
}

http {
include       /etc/nginx/mime.types;
default_type  application/octet-stream;

log_format  main  '$remote_addr -$remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

access_log  /var/log/nginx/access.log  main;

sendfile        on;
tcp_nopush      on;
tcp_nodelay     on;
keepalive_timeout  65;
types_hash_max_size 2048;

# ---------------------------------------------------------------------------
# Bezpieczeństwo i wydajność
# ---------------------------------------------------------------------------
server_tokens off;

gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/vnd.ms-fontobject
    application/x-font-ttf
    font/opentype
    image/svg+xml
    image/x-icon;

client_max_body_size 64M;

# ---------------------------------------------------------------------------
# 0. Default server
# Blokuje wejścia po surowym IPv4 lub nieobsługiwanych domenach
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# ---------------------------------------------------------------------------
# 1. Aplikacja Laravel: app.organiso.eu
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name app.organiso.eu;

    root /var/www/public;
    index index.php index.html;

    charset utf-8;

    # Nagłówki bezpieczeństwa
    add_header X-Frame-Options           "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-XSS-Protection          "1; mode=block"                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    location /build/ {
        expires max;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(ico|css|js|gif|jpe?g|png|svg|webp|woff2?|ttf|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass   php-fpm:9000;
        fastcgi_index  index.php;

        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param  DOCUMENT_ROOT   $realpath_root;

        fastcgi_param  HTTP_X_REAL_IP         $remote_addr;
        fastcgi_param  HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param  HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;

        fastcgi_read_timeout 300;
        fastcgi_buffer_size  128k;
        fastcgi_buffers      4 256k;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ ^/(app|bootstrap|config|database|resources|routes|storage|tests|vendor)/ {
        deny all;
    }
}

# ---------------------------------------------------------------------------
# 2. Aplikacja FastAPI (Uvicorn): doniczka.organiso.eu
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name doniczka.organiso.eu;

    # Nagłówki bezpieczeństwa
    add_header X-Frame-Options           "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    location / {
        # "doniczka-web" to nazwa kontenera lub usługi w docker-compose
        # 8000 to domyślny wewnętrzny port Uvicorn
        proxy_pass http://doniczka-web:8000;
        proxy_http_version 1.1;

        # Obsługa WebSocketów (często używanych w FastAPI)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Przekazywanie nagłówków hosta i IP klienta
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Przydatne przy długich requestach / streamingu w FastAPI
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
}