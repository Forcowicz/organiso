user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # ---------------------------------------------------------------------------
    # Security: hide Nginx version from response headers
    # ---------------------------------------------------------------------------
    server_tokens off;

    # ---------------------------------------------------------------------------
    # Gzip compression
    # ---------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ---------------------------------------------------------------------------
    # File upload limit (match php.ini / php-fpm settings)
    # ---------------------------------------------------------------------------
    client_max_body_size 64M;

    server {
        listen 80;
        server_name _;

        root /var/www/public;
        index index.php index.html;

        charset utf-8;

        # ---------------------------------------------------------------------------
        # Security headers
        # ---------------------------------------------------------------------------
        add_header X-Frame-Options           "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options    "nosniff"                         always;
        add_header X-XSS-Protection          "1; mode=block"                   always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # ---------------------------------------------------------------------------
        # Static assets built by Vite (e.g. /build/assets/*)
        # Content-hashed filenames - safe to cache forever.
        # ---------------------------------------------------------------------------
        location /build/ {
            expires max;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ---------------------------------------------------------------------------
        # Other well-known static files
        # ---------------------------------------------------------------------------
        location ~* \.(ico|css|js|gif|jpe?g|png|svg|webp|woff2?|ttf|eot|otf)$ {
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }

        # ---------------------------------------------------------------------------
        # Health-check endpoint (used by load-balancers / Docker health checks)
        # ---------------------------------------------------------------------------
        location = /healthz {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ---------------------------------------------------------------------------
        # Main Laravel entry-point
        # ---------------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # ---------------------------------------------------------------------------
        # PHP-FPM upstream
        # 'php-fpm' resolves to the php-fpm container on the organiso-production
        # Docker network defined in compose.prod.yaml.
        # ---------------------------------------------------------------------------
        location ~ \.php$ {
            fastcgi_pass  php-fpm:9000;
            fastcgi_index index.php;

            include       fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $realpath_root;

            # Forward real client IP when behind a load-balancer / proxy
            fastcgi_param HTTP_X_REAL_IP       $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

            fastcgi_read_timeout  300;
            fastcgi_buffer_size   128k;
            fastcgi_buffers       4 256k;
        }

        # ---------------------------------------------------------------------------
        # Deny access to hidden files (.env, .git, etc.)
        # ---------------------------------------------------------------------------
        location ~ /\.(?!well-known) {
            deny all;
        }

        # ---------------------------------------------------------------------------
        # Deny direct access to Laravel internals outside of public/
        # ---------------------------------------------------------------------------
        location ~ ^/(app|bootstrap|config|database|resources|routes|storage|tests|vendor)/ {
            deny all;
        }
    }
}
